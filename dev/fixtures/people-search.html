<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LinkedIn People Search Mock</title>
</head>
<body>
  <div class="search-results-container">
    <ul class="reusable-search__entity-result-list">
      <!-- Person 1: Recruiter -->
      <li class="reusable-search__result-container">
        <div class="entity-result">
          <div class="entity-result__title-text">
            <a href="https://www.linkedin.com/in/sarah-connor-recruiter">
              <span aria-hidden="true">Sarah Connor</span>
            </a>
          </div>
          <div class="entity-result__primary-subtitle">Technical Recruiter at Figma | Hiring Engineers & Designers</div>
          <div class="entity-result__secondary-subtitle">San Francisco Bay Area</div>
        </div>
      </li>

      <!-- Person 2: Engineering Manager -->
      <li class="reusable-search__result-container">
        <div class="entity-result">
          <div class="entity-result__title-text">
            <a href="https://www.linkedin.com/in/david-chen-eng">
              <span aria-hidden="true">David Chen</span>
            </a>
          </div>
          <div class="entity-result__primary-subtitle">Engineering Manager, Collaboration at Figma</div>
          <div class="entity-result__secondary-subtitle">San Francisco, CA</div>
        </div>
      </li>

      <!-- Person 3: Senior Engineer / Alum -->
      <li class="reusable-search__result-container">
        <div class="entity-result">
          <div class="entity-result__title-text">
            <a href="https://www.linkedin.com/in/emily-watson-dev">
              <span aria-hidden="true">Emily Watson</span>
            </a>
          </div>
          <div class="entity-result__primary-subtitle">Staff Software Engineer at Figma · UC Berkeley CS Alum</div>
          <div class="entity-result__secondary-subtitle">Oakland, CA</div>
        </div>
      </li>
    </ul>
  </div>
</body>
</html>
